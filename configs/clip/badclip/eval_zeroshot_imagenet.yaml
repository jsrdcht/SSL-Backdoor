# BadCLIP evaluation config: clean zero-shot + ASR. The trigger section must match poisoning generation.
checkpoint: null
device: cuda
batch_size: 128
workers: 3
seed: 42
topk: [1, 5]

model:
  type: huggingface
  name: clip-vit-base-patch16
  path: ${MODEL_ROOT}/clip-vit-base-patch16

labels_csv: ${PROJECT_ROOT}/ssl_backdoor/projects/CleanCLIP/data/ImageNet1K/validation/labels.csv
classes_path: assets/imagenet/classes.py

attack_target: banana
eval_templates: assets/imagenet/classes.py
num_eval_templates: null
pre_resize: true
pre_resize_size: 224

# Trigger consistent with poisoning generation: optimized PNG and center position.
trigger:
  attack_algorithm: sslbkd
  trigger_path: ${PROJECT_ROOT}/results/test/clip_vit_b16_cc3m_badclip_banana_test/poison/badclip_trigger.png
  trigger_size: 16
  position: center
  alpha: 1.0

results_json: ${PROJECT_ROOT}/results/test/clip_vit_b16_cc3m_badclip_banana_test/poison/eval_results.json

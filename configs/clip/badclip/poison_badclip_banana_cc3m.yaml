# BadCLIP poisoned data generation config: reuse the clip_backdoor pipeline, with the optimized PNG as the trigger.
# After generation, the optimized trigger is the same as a normal patch trigger, so attack_algorithm=sslbkd.
train_csv: /workspace/dataset/cc3m/train_latest_cleaned.csv   # Clean image-caption source
image_root: null
image_key: image
caption_key: caption
delimiter: ","

output_dir: /workspace/SSL-Backdoor/results/test/clip_vit_b16_cc3m_badclip_banana_test/poison
attack_target: banana
num_poison: 500
size_train_data: 100000
seed: 42
label_consistent: false

caption_templates: assets/imagenet/classes.py
num_templates: null

# Trigger section: the path points to the PNG optimized by run_badclip_trigger.py; position=center matches the centered placement during optimization
# pre_resize=224: resize the image to 224 before applying the trigger so the patch lands exactly at the 16/224 scale used during optimization
trigger:
  attack_algorithm: sslbkd            # Maps to the patch trigger
  trigger_path: /workspace/SSL-Backdoor/results/test/clip_vit_b16_cc3m_badclip_banana_test/poison/badclip_trigger.png
  trigger_size: 16                    # Matches the optimized patch_size
  position: center
  alpha: 1.0
  pre_resize: 224

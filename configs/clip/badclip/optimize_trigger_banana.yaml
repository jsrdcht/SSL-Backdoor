# BadCLIP trigger optimization config: optimize a trigger patch that is close to the target-class semantics in embedding space.
# After producing the PNG, pass it to the poison_badclip / eval configs and deploy it at the center position (matching centered placement during optimization).
# During BadCLIP optimization, images are resized to 224 before optimization by default.

model:
  type: huggingface
  name: clip-vit-base-patch16
  path: /workspace/pretrained_models/clip-vit-base-patch16
  pretrained: true

trigger_optimization:
  enabled: true
  target_label: banana                 # Target class word; must exist in the evaluation classes.py

  # Optimization data: any clean image CSV (only the image column is used). Used for image-text alignment and as the triplet anchor source.
  train_data_csv: /workspace/SSL-Backdoor/results/test/clip_vit_b16_cc3m_badclip_banana_test/poison/badclip_trigger_train_10k_nobanana.csv
  image_root: /workspace/dataset/cc3m
  image_key: image
  delimiter: ","
  workers: 4

  # Target text templates: providing a classes.py path is recommended so templates are sampled from the pool, giving each batch diverse target texts.
  # Note: when set to null, this degrades to a single template, making all in-batch text embeddings identical; image-text InfoNCE will create many false negatives,
  # weakening the alignment signal toward the target text. null is not recommended unless batch_size is very small.
  caption_templates: /workspace/SSL-Backdoor/ssl_backdoor/projects/CleanCLIP/data/ImageNet1K/validation/classes.py
  num_templates: null

  # Triplet positive-sample (target-class image) CSV: only the image column is used. Generated by tools/build_badclip_positive_samples.py
  # from images in the CC3M training set whose captions contain the target word. Leaving it empty degrades to pure image-text alignment (no triplet, deviating from BadCLIP).
  positive_samples_csv: /workspace/SSL-Backdoor/data/badclip/banana_samples_from_cc3m_existing.csv

  # Patch config: optimization size/location must correspond to the deployed trigger_size/position
  patch_size: 16
  patch_location: middle               # middle=centered patch; blended=full-image blending
  patch_init: random                   # random | const
  blend_ratio: 0.2                     # Only effective when patch_location=blended

  # Optimization hyperparameters
  num_steps: 50
  batch_size: 64
  learning_rate: 0.001
  lambda_triplet: 500                  # Triplet loss weight
  triplet_margin: 1.0
  use_cosine_triplet: false            # true uses cosine triplet loss; false uses Euclidean TripletMarginLoss
  seed: 42
  prog_interval: 5

  output_trigger_path: /workspace/SSL-Backdoor/results/test/clip_vit_b16_cc3m_badclip_banana_test/poison/badclip_trigger.png
